name: Browser Extension Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm i

      # Build Chrome
      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Archive Chrome (ZIP)
        run: |
          cd dist/chrome
          zip -r ../../LiveVideoWallppr-Chrome.zip .

      # Build Firefox
      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Archive Firefox (ZIP)
        run: |
          cd dist/firefox
          zip -r ../../LiveVideoWallppr-Firefox.zip .

      # Build Edge
      - name: Build Edge extension
        run: npm run build:edge

      - name: Archive Edge (ZIP)
        run: |
          cd dist/edge
          zip -r ../../LiveVideoWallppr-Edge.zip .

      # Upload all assets to GitHub Release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiveVideoWallppr-Chrome.zip
            LiveVideoWallppr-Firefox.zip
            LiveVideoWallppr-Edge.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
