name: Browser Extension Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # gunakan versi terbaru

      - name: Install dependencies
        run: npm i

      - name: Build Chrome
        run: npm run build:chrome
      - name: Archive Chrome
        run: |
          cd dist/chrome
          zip -r ../../LiveVideoWallppr-Chrome.zip .

      - name: Build Firefox
        run: npm run build:firefox
      - name: Archive Firefox
        run: |
          cd dist/firefox
          zip -r ../../LiveVideoWallppr-Firefox.zip .

      - name: Build Edge
        run: npm run build:edge
      - name: Archive Edge
        run: |
          cd dist/edge
          zip -r ../../LiveVideoWallppr-Edge.zip .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiveVideoWallppr-Chrome.zip
            LiveVideoWallppr-Firefox.zip
            LiveVideoWallppr-Edge.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
