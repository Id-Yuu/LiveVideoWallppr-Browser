changelog:
  exclude:
    labels:
      - ignore-for-release
      - internal
    authors:
      - dependabot
      - github-actions[bot]
  categories:
    - title: 🚀 New Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🔧 Maintenance & Dependencies
      labels:
        - maintenance
        - dependencies
        - chore
    - title: ⚡ Performance
      labels:
        - performance
    - title: 🎨 UI/UX
      labels:
        - ui
        - ux
        - styling
